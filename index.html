html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:'Outfit',system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;position:relative}
.glow{position:fixed;inset:-20%;filter:blur(90px);opacity:.35;z-index:0;pointer-events:none}
.glow i{position:absolute;border-radius:50%;animation:drift 20s ease-in-out infinite alternate}
.glow i:nth-child(1){width:46vmax;height:46vmax;left:6%;top:8%;background:var(--violet);opacity:.85}
.glow i:nth-child(2){width:40vmax;height:40vmax;right:4%;bottom:4%;background:var(--indigo);animation-delay:-7s}
.glow i:nth-child(3){width:28vmax;height:28vmax;left:42%;top:44%;background:var(--fuchsia);opacity:.6;animation-delay:-12s}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.15)}}
main{position:relative;z-index:1;text-align:center;padding:0 20px}
.hero{position:relative;height:clamp(230px,36vmin,380px);--sz:clamp(74px,13.5vmin,136px)}

.launch{position:relative;z-index:2;border:0;border-radius:999px;padding:1.15rem 4rem;font:inherit;font-size:1.15rem;font-weight:600;letter-spacing:.01em;color:#fff;cursor:pointer;

.launch:focus-visible{outline:3px solid #fff;outline-offset:4px}
.note{position:relative;z-index:2;margin-top:1.2rem;font-size:.85rem;color:#ff9bb0;min-height:1.2em}

#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}

.sun{position:absolute;left:50%;top:50%;width:var(--sz);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);

.sun::after{inset:-50%;background:repeating-conic-gradient(rgba(255,140,80,.3) 0 4deg,transparent 4deg 22deg);animation:spin 80s linear infinite reverse}
@keyframes pulse{to{box-shadow:0 0 52px 20px rgba(255,180,80,.65),0 0 160px 64px rgba(255,120,60,.38)}}
.orbit{position:absolute;left:0;top:0;width:var(--d);height:var(--d);margin:calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  border:1px solid rgba(196,170,255,.16);border-radius:50%;animation:spin var(--t) linear infinite;animation-delay:calc(var(--t) * var(--p) * -1)}
.orbit.belt{border:3px dotted rgba(214,196,255,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
.orbit i{animation:unspin var(--t) linear infinite;animation-delay:calc(var(--t) * var(--p) * -1);position:absolute;top:0;left:50%;width:var(--s);height:var(--s);

.orbit .ring::after{content:"";position:absolute;left:50%;top:50%;width:230%;height:70%;border:2px solid rgba(255,225,170,.7);border-radius:50%;transform:translate(-50%,-50%) rotate(-22deg)}

mkStars(60);

function setMenu(o){
  menu.classList.toggle('open',o); scrim.style.display=o?'block':'none'; orb.classList.toggle('on',o);
  orb.setAttribute('aria-label',o?'Close menu':'Open menu');
  if(o) renderTabs();
}
function norm(v){
  v=v.trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[^\s]+\.[^\s]{2,}$/.test(v)) return 'https://'+v;
  return 'https://duckduckgo.com/?q='+encodeURIComponent(v);
}
function nameOf(u){
  try{var h=new URL(u).hostname.replace(/^www\./,'');
    if(h.indexOf('cloudmoon')>-1) return 'CloudMoon';
    return h.charAt(0).toUpperCase()+h.slice(1);
  }catch(e){return 'New tab';}
}
function colorOf(s){var n=0;for(var i=0;i<s.length;i++)n+=s.charCodeAt(i);return COLORS[n%COLORS.length]}
function avatar(name){var a=document.createElement('span');a.className='av';a.style.background=colorOf(name);a.textContent=name.charAt(0).toUpperCase();return a}
function sandbox(f){
  if(fix) f.setAttribute('sandbox','allow-forms allow-scripts allow-same-origin allow-popups');
  else f.removeAttribute('sandbox');
}
function addTab(u){
  u=norm(u); if(!u) return;
  var f=document.createElement('iframe'),id='f'+Date.now()+Math.floor(Math.random()*99);
  f.id=id; f.setAttribute('allow','fullscreen; autoplay; clipboard-write; gamepad; microphone; camera; pointer-lock; keyboard-map');
  sandbox(f); f.src=u; view.appendChild(f);
  tabs.push({id:id,url:u,name:nameOf(u)});
  switchTab(tabs.length-1); setMenu(false);
}
function switchTab(i){
  active=i;
  var fs=view.querySelectorAll('iframe');
  for(var k=0;k<fs.length;k++) fs[k].classList.toggle('on',!!tabs[i]&&fs[k].id===tabs[i].id);
  $('welcome').style.display=i<0?'flex':'none';
  addr.value=tabs[i]?tabs[i].url:'';
  renderTabs();
}
function closeTab(e,i){
  e.stopPropagation();
  var el=$(tabs[i].id); if(el) el.remove();
  tabs.splice(i,1);
  if(!tabs.length) switchTab(-1);
  else switchTab(Math.max(0,Math.min(active>=i?active-1:active,tabs.length-1)));
}
function renderTabs(){
  list.innerHTML='';
  if(!tabs.length){var n=document.createElement('div');n.className='none';n.textContent='No tabs yet. Jump to a site or enter one above.';list.appendChild(n);return;}
  tabs.forEach(function(t,i){
    var r=document.createElement('div');r.className='trow'+(i===active?' on':'');
    var s=document.createElement('span');s.textContent=t.name;
    var x=document.createElement('button');x.className='x';x.textContent='\u00d7';x.setAttribute('aria-label','Close tab');
    x.onclick=function(e){closeTab(e,i)};
    r.onclick=function(){switchTab(i);setMenu(false)};
    r.appendChild(avatar(t.name));r.appendChild(s);r.appendChild(x);list.appendChild(r);
  });
}
function reload(){
  if(active<0) return;
  var f=$(tabs[active].id),s=f.src; f.src='about:blank'; setTimeout(function(){f.src=s},60); setMenu(false);
}
function setCloak(b){
  document.title=b.dataset.t;
  var l=document.querySelector('link[rel=icon]')||document.createElement('link');
  l.rel='icon';
  l.href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="'+b.dataset.c+'"/></svg>');
  document.head.appendChild(l);
  var all=document.querySelectorAll('#cloaks button');
  for(var k=0;k<all.length;k++) all[k].classList.toggle('sel',all[k]===b);
}
function go(newTab){
  var u=norm(addr.value); if(!u){addr.focus();return;}
  if(active>=0&&!newTab){tabs[active].url=u;tabs[active].name=nameOf(u);$(tabs[active].id).src=u;renderTabs();setMenu(false);}
  else addTab(u);
}
function tile(q,parent){
  var b=document.createElement('button');b.className='t';
  b.appendChild(avatar(q[0]));b.appendChild(document.createTextNode(q[0]));
  b.onclick=function(){addTab(q[1])};parent.appendChild(b);
}
QUICK.forEach(function(q){tile(q,$('wtiles'));tile(q,$('quick'))});

orb.onclick=function(){setMenu(!menu.classList.contains('open'))};
scrim.onclick=function(){setMenu(false)};
$('go').onclick=function(){go(false)};
$('nt').onclick=function(){go(true)};
addr.addEventListener('keydown',function(e){if(e.key==='Enter')go(false)});
$('home').onclick=function(){switchTab(-1);setMenu(false)};
$('rl').onclick=reload;
$('fs').onclick=function(){
  var d=document,el=d.documentElement;
  if(d.fullscreenElement) d.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen();
  setMenu(false);
};
var cl=document.querySelectorAll('#cloaks button');
for(var j=0;j<cl.length;j++) cl[j].onclick=(function(b){return function(){setCloak(b)}})(cl[j]);
$('swFix').onclick=function(){
  fix=!fix; this.classList.toggle('on',fix);
  var fs=view.querySelectorAll('iframe');
  for(var k=0;k<fs.length;k++){(function(f){var s=f.src;sandbox(f);f.src='about:blank';setTimeout(function(){f.src=s},60)})(fs[k]);}
};
$('swPanic').onclick=function(){panic=!panic;this.classList.toggle('on',panic)};
$('kill').onclick=function(){window.close()};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') setMenu(false);
  if(e.key==='`'&&panic){var n=Date.now();if(n-lastKey<500)window.close();lastKey=n;}
});
<\/script>
</body>

</script>

<script>
function mkStars(n){var s=document.getElementById('stars');for(var i=0;i<n;i++){var d=document.createElement('i'),z=Math.random()<.2?3:2;
d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.width=d.style.height=z+'px';
d.style.animationDelay=(-Math.random()*4)+'s';d.style.animationDuration=(3+Math.random()*4)+'s';s.appendChild(d);}}
mkStars(90);
document.getElementById('launch').onclick=function(){
  var note=document.getElementById('note');
  var popup=window.open('about:blank','AstraSession','width=1280,height=720');
  if(!popup){note.textContent='Pop-up blocked. Allow pop-ups for this page, then try again.';return;}
  note.textContent='';
  var closeTag='<'+'/script>';
  var html=document.getElementById('session-src').textContent.split('<\\/script>').join(closeTag);
  popup.document.open();popup.document.write(html);popup.document.close();
};
</script>
